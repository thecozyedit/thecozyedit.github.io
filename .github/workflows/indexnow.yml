name: IndexNow ping

# Tells Bing (and other IndexNow search engines) about every page in the sitemap
# whenever the site changes, so new and updated guides get crawled quickly.
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to publish
        run: sleep 90
      - name: Submit sitemap URLs to IndexNow
        run: |
          URLS=$(curl -s https://thecozyedit.github.io/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -s -c .)
          echo "Submitting: $URLS"
          BODY=$(jq -n -c --argjson urls "$URLS" '{host:"thecozyedit.github.io",key:"911a95de0d433932497bdce8f7970b9e",keyLocation:"https://thecozyedit.github.io/911a95de0d433932497bdce8f7970b9e.txt",urlList:$urls}')
          CODE=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow response: $CODE"; cat /tmp/resp.txt
          case "$CODE" in 200|202) exit 0;; *) exit 1;; esac
